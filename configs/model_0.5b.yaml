# Selected SLM (see reports/model_selection.md for the comparison and justification).
model:
  name: Qwen/Qwen2.5-0.5B-Instruct   # Apache-2.0, ~0.5B params - CPU-friendly fallback
  revision: null                     # TODO before final run: pin an exact commit hash for reproducibility
  trust_remote_code: false

generation:                          # "efficient generation settings": greedy, short cap, KV-cache on
  max_new_tokens: 160
  do_sample: false
  repetition_penalty: 1.0

paths:
  adapter_dir: artifacts/adapter_0.5b
  merged_dir: artifacts/merged_0.5b
  experiments_dir: experiments_0.5b

retrieval:
  top_k: 1

eval:
  mode: retrieved                    # retrieved = real pipeline | oracle = gold policy text (isolates the model)
  batch_size: 1
