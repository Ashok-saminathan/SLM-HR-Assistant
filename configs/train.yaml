# LoRA / QLoRA fine-tuning settings. Test split is NEVER used here (validation only).
seed: 42
method: lora            # lora | qlora   (qlora = 4-bit NF4 base + LoRA; needs CUDA + bitsandbytes)
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
training:
  epochs: 3
  per_device_batch_size: 4
  grad_accum_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_seq_len: 768
  logging_steps: 2
  gradient_checkpointing: true
